<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF6EE">
<meta property="og:title" content="ISHAK · Creative Ads">
<meta property="og:description" content="فيديوهات إعلانية بالذكاء الاصطناعي وحسابات TikTok و Meta Ads في الجزائر.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%230E1F15%27/%3E%3Cpath d=%27M7 4v13h10%27 fill=%27none%27 stroke=%27%233DC163%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<title>ISHAK Creative Ads</title>
<meta name="description" content="فيديوهات إعلانية بالذكاء الاصطناعي وحسابات TikTok و Meta Ads في الجزائر. اطلب عبر الاستمارة أو واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: light mint "glass" storefront — floating pill nav, hero with a product→ad phone demo, service cards like a shop grid, an order bay with two paths (form or WhatsApp). Reference: soft green glass mobile UI. */
:root{
--bg:#EAF6EE; --bg-2:#DDF1E3; --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.85); --stroke:rgba(255,255,255,.9);
--ink:#0E1F15; --ink-2:#2E4437; --muted:#5C7366; --line:#CFE5D6;
--green:#22B04B; --green-2:#3DC163; --green-deep:#15843A; --green-ink:#0B5E27; --on-green:#FFFFFF; --mint:#C9F0D5;
--bad:#C0352B; --bad-soft:#FDECEA;
--shadow:0 1px 2px rgba(14,31,21,.05),0 12px 32px rgba(21,132,58,.10);
--shadow-lg:0 24px 60px rgba(21,132,58,.18);
--font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
--r:22px;
color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:radial-gradient(1200px 600px at 85% -10%,#CFF3DA 0%,transparent 60%),radial-gradient(900px 500px at -10% 30%,#D8F5E1 0%,transparent 55%),var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:12px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.blob{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--green-ink);background:var(--glass-2);border:1px solid var(--stroke);padding:6px 12px;border-radius:99px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,176,75,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 22px;border-radius:99px;border:0;cursor:pointer;font-weight:600;font-size:15.5px;text-decoration:none;white-space:nowrap;transition:transform .15s ease,box-shadow .2s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:linear-gradient(135deg,var(--green-2),var(--green) 55%,var(--green-deep));color:var(--on-green);box-shadow:0 10px 24px rgba(34,176,75,.35)}
.btn.pri:hover{box-shadow:0 14px 30px rgba(34,176,75,.45)}
.btn.soft{background:var(--glass-2);color:var(--ink);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.btn.soft:hover{background:#fff}
.btn.wa{background:#fff;color:var(--green-ink);border:1.5px solid var(--green)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
/* nav */
.nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;margin-top:10px}
.nav .bar{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:99px}
[dir=rtl] .nav .bar{padding:8px 18px 8px 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:19px}
.brand .mk{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#0E1F15,#1D3A27);display:grid;place-items:center}
.brand small{font-weight:500;font-size:12px;color:var(--muted);display:block;line-height:1}
.links{display:flex;gap:4px;margin-inline-start:auto}
.links a{text-decoration:none;font-size:14.5px;color:var(--ink-2);padding:9px 14px;border-radius:99px}
.links a:hover{background:rgba(255,255,255,.8)}
.lang{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;font-weight:500}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:56px 40px}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.2rem);margin-top:18px}
.hero h1 .g{background:linear-gradient(135deg,var(--green-2),var(--green-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1.12rem;color:var(--muted);max-width:50ch;margin-top:18px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.stat{padding:12px 16px;border-radius:18px;display:flex;flex-direction:column;min-width:130px}
.stat b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
/* phone demo */
.demo{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1}
.phone{position:relative;width:min(310px,80vw);aspect-ratio:9/17;border-radius:36px;padding:12px;background:rgba(255,255,255,.55);border:1px solid #fff;box-shadow:var(--shadow-lg);backdrop-filter:blur(14px)}
.screen{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#F4FBF6}
.scr-top{position:absolute;inset-inline:14px;top:12px;display:flex;justify-content:space-between;align-items:center;z-index:9;font-size:11px;font-weight:600;color:var(--ink-2);direction:ltr}
.scr-top .rec{display:inline-flex;align-items:center;gap:5px;background:#fff;padding:3px 8px;border-radius:99px;box-shadow:var(--shadow)}
.scr-top .rec i{width:6px;height:6px;border-radius:50%;background:#E5484D}
.ly{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.s1 .l1,.s2 .l2,.s3 .l3,.s4 .l3,.s5 .l3,.s4 .l4,.s5 .l5{opacity:1}
.l1{background:linear-gradient(160deg,#D9D6CF,#B9B5AC)}
.l1 .cap{position:absolute;bottom:16px;inset-inline-start:14px;font-size:10.5px;color:#4B4943;direction:ltr;background:rgba(255,255,255,.6);padding:2px 8px;border-radius:99px}
.l2{background:#F4FBF6;background-image:linear-gradient(rgba(34,176,75,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(34,176,75,.18) 1px,transparent 1px);background-size:33.33% 33.33%}
.l2 .note{position:absolute;font-size:10px;font-weight:600;color:var(--green-ink);background:#fff;border:1px dashed var(--green);padding:3px 8px;border-radius:99px;direction:ltr}
.l3{background:radial-gradient(110% 65% at 50% 30%,#7FE09B 0%,#2EAA51 40%,#0F5A27 78%)}
.l3 .floor{position:absolute;inset-inline:0;bottom:0;height:32%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.35))}
.l3 .ring{position:absolute;left:50%;top:54%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.l4 .sweep{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-14deg);animation:sweep 2.4s ease-in-out infinite}
.l4 .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.8;animation:rise 2.2s ease-in infinite}
@keyframes sweep{from{left:-50%}to{left:120%}}
@keyframes rise{from{transform:translateY(20px);opacity:0}40%{opacity:.9}to{transform:translateY(-60px);opacity:0}}
.l5 .head{position:absolute;inset-inline:16px;top:15%;text-align:center;color:#fff}
.l5 .head small{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;background:#fff;color:var(--green-ink);padding:3px 10px;border-radius:99px;margin-bottom:8px}
.l5 .head b{display:block;font-size:23px;line-height:1.25;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.l5 .buy{position:absolute;inset-inline:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:18px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);font-size:12.5px;font-weight:600}
[dir=rtl] .l5 .buy{padding:8px 14px 8px 8px}
.l5 .buy span:last-child{background:linear-gradient(135deg,var(--green-2),var(--green-deep));color:#fff;border-radius:12px;padding:7px 12px;white-space:nowrap}
.prod{position:absolute;left:50%;top:55%;width:32%;transform:translate(-50%,-50%) rotate(-9deg);z-index:5;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.prod .c{width:46%;height:16%;margin:0 auto;background:linear-gradient(90deg,#1B2A21,#47584D 45%,#14201A);border-radius:6px 6px 2px 2px}
.prod .n{width:30%;height:5%;margin:0 auto;background:#CFE5D6}
.prod .b{aspect-ratio:.62;border-radius:20px 20px 24px 24px;background:linear-gradient(100deg,rgba(255,255,255,.95) 0%,rgba(220,246,228,.8) 25%,rgba(61,193,99,.75) 62%,rgba(15,90,39,.95) 100%);border:1px solid rgba(255,255,255,.8);position:relative;overflow:hidden}
.prod .b::before{content:"";position:absolute;left:12%;top:6%;width:12%;height:80%;border-radius:20px;background:rgba(255,255,255,.7)}
.prod .b::after{content:"N°7";position:absolute;inset-inline:0;bottom:22%;text-align:center;font-weight:700;font-size:13px;color:rgba(11,94,39,.9);letter-spacing:.08em;direction:ltr}
.s1 .prod{filter:saturate(.5) brightness(.92)}
.s2 .prod{filter:grayscale(1) contrast(1.1);opacity:.7}
.s3 .prod,.s4 .prod,.s5 .prod{transform:translate(-50%,-50%) rotate(0);filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}
.s4 .prod{animation:float 2.4s ease-in-out infinite}
.s5 .prod{transform:translate(-50%,-36%) scale(1.06)}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-57%)}}
.pills{display:flex;gap:6px;padding:6px;border-radius:99px;flex-wrap:wrap;justify-content:center}
.pills button{min-height:38px;padding:0 14px;border-radius:99px;border:0;background:none;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2);position:relative;overflow:hidden}
.pills button.on{background:linear-gradient(135deg,var(--green-2),var(--green));color:#fff;box-shadow:0 6px 16px rgba(34,176,75,.35)}
.pills button.on::after{content:"";position:absolute;inset-inline-start:0;bottom:0;height:3px;background:rgba(255,255,255,.75);animation:fill var(--dur,2600ms) linear forwards}
.paused .pills button.on::after{animation:none;width:100%}
@keyframes fill{from{width:0}to{width:100%}}
.demo-note{font-size:12.5px;color:var(--muted)}
/* sections */
section.s{position:relative;padding-block:72px}
.sh{display:flex;flex-direction:column;gap:12px;max-width:680px;margin-bottom:30px}
.sh.c{margin-inline:auto;text-align:center;align-items:center}
.sh h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
.sh p{color:var(--muted);font-size:1.05rem}
/* problems */
.probs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.prob{border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.prob .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--mint);color:var(--green-ink)}
.prob .ic svg{width:22px;height:22px}
.prob h3{font-size:1.12rem}
.prob p{color:var(--muted);font-size:15px}
/* shop grid */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .vis{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;max-width:100%}
.card .vis .tg{position:absolute;top:10px;inset-inline-start:10px;font-size:11.5px;font-weight:600;background:#fff;color:var(--green-ink);padding:3px 10px;border-radius:99px;box-shadow:var(--shadow)}
.card .bd{padding:2px 6px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.08rem}
.card p{color:var(--muted);font-size:14px}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--green-ink)}
.price small{font-size:.72em;font-weight:500;color:var(--muted);margin-inline-start:3px}
.price.q{font-size:.95rem;color:var(--ink-2);font-weight:600}
.card[hidden]{display:none}
/* feature pack (detail card) */
.pack{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:28px;overflow:hidden}
.pack .art{position:relative;min-height:340px;background:radial-gradient(90% 80% at 30% 30%,#8BE5A6,#2BAA50 55%,#0F5A27)}
.pack .body{padding:34px;display:flex;flex-direction:column;gap:16px;background:rgba(255,255,255,.75)}
.pack h3{font-size:1.9rem}
.pack ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pack li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.pack li svg{width:20px;height:20px;color:var(--green);flex:none;margin-top:3px}
.totals{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.totals .l{font-size:13px;color:var(--muted);font-weight:500}
.totals .v{font-size:2rem;font-weight:700;color:var(--green-ink);font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg-2);cursor:pointer;font-size:20px;font-weight:600;color:var(--ink)}
.stepper button:hover{background:var(--mint)}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* ai + process */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.split{border-radius:var(--r);overflow:hidden}
.split .r{display:grid;grid-template-columns:1fr 1fr}
.split .r>div{padding:13px 18px;font-size:14.5px;min-width:0;border-top:1px solid var(--line)}
.split .r>div+div{border-inline-start:1px solid var(--line)}
.split .r.h>div{border-top:0;font-weight:700;color:var(--green-ink);background:rgba(201,240,213,.55)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.step{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .n{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--green-2),var(--green-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.step b{font-size:1.05rem}
.step p{color:var(--muted);font-size:14px}
/* order bay */
.order{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.order .side{border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(160deg,#173B25,#0E1F15);color:#EAF6EE;border:0}
.order .side h2{font-size:clamp(1.7rem,3.2vw,2.3rem)}
.order .side p{color:#B5CCBE}
.order .side .row{display:flex;gap:12px;align-items:center;font-size:14.5px}
.order .side .row svg{width:20px;height:20px;color:var(--green-2);flex:none}
.order .side .num{direction:ltr;unicode-bidi:isolate;font-weight:600;color:#fff}
.panel{border-radius:28px;padding:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(207,229,214,.55);border-radius:99px;padding:5px}
.tabs button{min-height:46px;border-radius:99px;border:0;background:none;cursor:pointer;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2)}
.tabs button svg{width:19px;height:19px}
.tabs button.on{background:#fff;color:var(--green-ink);box-shadow:var(--shadow)}
.pane{padding:22px 16px 14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:14px;font-weight:600;color:var(--ink-2)}
.f .opt{font-weight:400;color:var(--muted)}
.f input:not([type=radio]),.f textarea{width:100%;min-height:50px;padding:12px 15px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:16px;transition:border-color .15s,box-shadow .15s}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(34,176,75,.15)}
.f.err input,.f.err textarea{border-color:var(--bad)}
.f .msg{font-size:13px;color:var(--bad);display:none}
.f.err .msg{display:block}
.f .help{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--ink)}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.chips label:has(input:checked){border-color:var(--green);background:var(--mint);color:var(--green-ink)}
.chips label:has(input:focus-visible){outline:3px solid var(--green);outline-offset:2px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.form-foot{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.form-foot .note{font-size:12.5px;color:var(--muted);text-align:center}
.alert{grid-column:1/-1;border-radius:14px;padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 10px}
.done .ok{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--green-2),var(--green-deep));display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(34,176,75,.4)}
.done .ok svg{width:34px;height:34px}
.done h3{font-size:1.5rem}
.done p{color:var(--muted);max-width:42ch}
.wa-list{display:flex;flex-direction:column;gap:10px}
.wa-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1.5px solid var(--line);text-decoration:none;min-height:60px;transition:border-color .15s,transform .15s}
.wa-item:hover{border-color:var(--green);transform:translateY(-1px)}
.wa-item .ic{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--green-ink);display:grid;place-items:center;flex:none}
.wa-item .ic svg{width:20px;height:20px}
.wa-item b{font-weight:600;display:block}
.wa-item span{font-size:13px;color:var(--muted)}
.wa-item .go{margin-inline-start:auto;color:var(--green);font-weight:600;font-size:13.5px;white-space:nowrap}
/* faq */
.faq{display:flex;flex-direction:column;gap:10px;max-width:820px;margin-inline:auto}
details{border-radius:18px;padding:4px 20px}
summary{cursor:pointer;list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
summary::-webkit-details-marker{display:none}

let filter = "all", packQty = 1, formQty = 1, selSvc = "";
function paint() {

document.getElementById("grid").innerHTML = SVC.map(s => `<article class="card glass" data-cat="${s.cat}" ${filter !== "all" && filter !== s.cat ? "hidden" : ""}><div class="vis">${artHtml(s.art)}${s.unit ? `<span class="tg">${esc(pick(s.unit))}</span>` : ""}</div><div class="bd"><h3>${esc(pick(s.name))}</h3><p>${esc(pick(s.desc))}</p><div class="ft">${s.price ? `<span class="price">${fmt(s.price)}<small>${tx("dzd")}</small></span>` : `<span class="price q">${tx("quote")}</span>`}<a class="btn pri sm" href="#order" data-order="${s.id}">${s.price ? tx("order") : tx("ask")}</a></div></div></article>`).join("");
document.getElementById("pk_list").innerHTML = TX.pk_list.map(p => `<li><svg><use href="#i-check"/></svg><span>${esc(pick(p))}</span></li>`).join("");
let h = ""; const r = TX.ai_rows; for (let i = 0; i < r.length; i += 2) h += `<div class="r ${i ? "" : "h"}"><div>${esc(pick(r[i]))}</div><div>${esc(pick(r[i + 1]))}</div></div>`;

document.getElementById("steps").innerHTML = TX.steps.map((s, i) => `<div class="step glass"><span class="n">${i + 1}</span><b>${esc(L === "ar" ? s[0] : s[1])}</b><p>${esc(L === "ar" ? s[2] : s[3])}</p></div>`).join("");
document.getElementById("svc").innerHTML = SVC.map(s => `<label><input type="radio" name="service" value="${s.id}" ${selSvc === s.id ? "checked" : ""}>${esc(pick(s.name))}</label>`).join("") + `<label><input type="radio" name="service" value="other" ${selSvc === "other" ? "checked" : ""}>${L === "ar" ? "شيء آخر" : "Something else"}</label>`;
document.getElementById("walist").innerHTML = [...SVC.map(s => [s.id, pick(s.name), s.price ? `${fmt(s.price)} ${tx("dzd")}` : tx("quote")]), ["other", L === "ar" ? "سؤال آخر" : "Another question", ""]].map(([id, n, p]) => `<a class="wa-item" href="${waLink(id)}" target="_blank" rel="noopener"><span class="ic"><svg><use href="#i-wa"/></svg></span><span><b>${esc(n)}</b><span>${esc(p)}</span></span><span class="go">${tx("wa_open")}</span></a>`).join("");
document.getElementById("faqlist").innerHTML = TX.faq.map(q => `<details class="glass"><summary>${esc(L === "ar" ? q[0] : q[1])}</summary><p>${esc(L === "ar" ? q[2] : q[3])}</p></details>`).join("");
document.querySelectorAll("[data-wa]").forEach(a => { a.href = waLink(a.dataset.wa); a.target = "_blank"; a.rel = "noopener"; });

document.getElementById("pills").innerHTML = TX.demo.map((d, i) => `<button type="button" role="tab" data-step="${i + 1}">${esc(pick(d))}</button>`).join("");

function updatePack() { document.getElementById("pk_qty").textContent = packQty; document.getElementById("pk_total").innerHTML = `${fmt(14000 * packQty)} <small style="font-size:.5em;color:var(--muted)">${tx("dzd")}</small>`; }
function updateQty() { document.getElementById("qty-row").hidden = selSvc !== "creative_ads"; document.getElementById("f_qty").textContent = formQty; document.getElementById("f_total").textContent = `${tx("total")}: ${fmt(14000 * formQty)} ${tx("dzd")} · ${formQty * 3} ${L === "ar" ? "إعلانات" : "ads"}`; }
// demo
let step = 1, timer = null; const DUR = 2600; const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function setStep(n) { step = n; document.getElementById("screen").className = "screen s" + n; document.querySelectorAll("#pills button").forEach((b, i) => { b.classList.toggle("on", i + 1 === n); b.setAttribute("aria-selected", i + 1 === n); }); document.getElementById("tc").textContent = `00:${String((n - 1) * 3).padStart(2, "0")}`; }
function play() { clearInterval(timer); if (reduce) return; document.getElementById("pills").classList.remove("paused"); timer = setInterval(() => setStep(step % 5 + 1), DUR); }
document.documentElement.style.setProperty("--dur", DUR + "ms");
// tabs
function showTab(wa) { document.getElementById("t-form").classList.toggle("on", !wa); document.getElementById("t-wa").classList.toggle("on", wa); document.getElementById("t-form").setAttribute("aria-selected", !wa); document.getElementById("t-wa").setAttribute("aria-selected", wa); document.getElementById("p-form").hidden = wa; document.getElementById("p-wa").hidden = !wa; }
// form
const $ = id => document.getElementById(id);
function setErr(id, on) { $(id).closest(".f").classList.toggle("err", on); $(id).setAttribute("aria-invalid", on); }
function validWa(v) { const d = v.replace(/[^\d+]/g, ""); return /^(\+?213|0)?[567]\d{8}$/.test(d.replace(/^\+/, "+")) || /^\+?\d{8,15}$/.test(d); }
async function submitOrder(e) {
e.preventDefault();
const name = $("o_name").value.trim(), wa = $("o_wa").value.trim(), biz = $("o_biz").value.trim(), msg = $("o_msg").value.trim();
const svc = (document.querySelector("#svc input:checked") || {}).value || "";
let bad = false;
setErr("o_name", name.length < 2); bad ||= name.length < 2;
const wOk = validWa(wa); setErr("o_wa", !wOk); bad ||= !wOk;
$("svc").closest(".f").classList.toggle("err", !svc); bad ||= !svc;
if (bad) { (document.querySelector(".f.err input, .f.err textarea") || $("svc").querySelector("input"))?.focus(); return; }
if ($("o_web").value) { showDone(svc); return; } // bot trap
const btn = $("o_send"); btn.disabled = true; btn.querySelector("span").textContent = tx("sending"); $("o_err").hidden = true;
const message = (svc === "creative_ads" ? `[${formQty}× 3 Creative Ads = ${14000 * formQty} DZD] ` : "") + msg;
try {
const r = await fetch(`${CFG.supabaseUrl}/rest/v1/leads`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.supabaseKey, Authorization: `Bearer ${CFG.supabaseKey}`, Prefer: "return=minimal" },
body: JSON.stringify({ name, whatsapp: wa.replace(/[^\d+ ]/g, "").slice(0, 20), business: biz || null, service: svc, message: message.slice(0, 1500) || null, lang: L, source: "website" }) });
if (!r.ok) throw new Error(r.status);
showDone(svc, name);
} catch (err) {
$("o_err").innerHTML = `${esc(tx("e_net"))} <a href="${waLink(svc || "other", name)}" target="_blank" rel="noopener" style="font-weight:600">WhatsApp</a>`; $("o_err").hidden = false;
} finally { btn.disabled = false; btn.querySelector("span").textContent = tx("send"); }
}
function showDone(svc, name) { $("of").hidden = true; $("o_done").hidden = false; $("d_wa").href = waLink(svc || "other", name || ""); $("o_done").querySelector("h3").focus?.(); }
document.addEventListener("click", e => {
const t = e.target;
if (t.id === "lang") { L = L === "ar" ? "en" : "ar"; try { localStorage.setItem("ofa-site-lang", L); } catch (er) {} paint(); return; }
const st = t.closest("#pills button"); if (st) { setStep(+st.dataset.step); clearInterval(timer); $("pills").classList.add("paused"); setTimeout(play, 6000); return; }
const f = t.closest("#filters button"); if (f) { filter = f.dataset.f; document.querySelectorAll("#filters button").forEach(b => { b.classList.toggle("on", b === f); b.setAttribute("aria-selected", b === f); }); document.querySelectorAll("#grid .card").forEach(c => c.hidden = filter !== "all" && c.dataset.cat !== filter); return; }
const o = t.closest("[data-order]"); if (o) { selSvc = o.dataset.order; showTab(false); paint(); }
if (t.closest("#pk_go")) { selSvc = "creative_ads"; formQty = packQty; showTab(false); paint(); }
if (t.closest("#pk_minus")) { packQty = Math.max(1, packQty - 1); updatePack(); }
if (t.closest("#pk_plus")) { packQty = Math.min(20, packQty + 1); updatePack(); }
if (t.closest("#f_minus")) { formQty = Math.max(1, formQty - 1); updateQty(); }
if (t.closest("#f_plus")) { formQty = Math.min(20, formQty + 1); updateQty(); }
if (t.closest("#t-form")) showTab(false);
if (t.closest("#t-wa")) showTab(true);
if (t.id === "d_again") { $("of").reset(); selSvc = ""; formQty = 1; $("of").hidden = false; $("o_done").hidden = true; paint(); }
});
document.addEventListener("change", e => { if (e.target.name === "service") { selSvc = e.target.value; $("svc").closest(".f").classList.remove("err"); updateQty(); } });
document.addEventListener("input", e => { const f = e.target.closest(".f.err"); if (f && e.target.matches("input,textarea")) { f.classList.remove("err"); e.target.removeAttribute("aria-invalid"); } });
$("of").addEventListener("submit", submitOrder);
paint(); if (reduce) setStep(5); else play();
